      #tcc-launch::before { animation:none; opacity:0; }
      .tcc-launch-stage { transition:opacity .18s linear!important; transform:none!important; filter:none!important; }
      #tcc-launch { transition:opacity .18s linear,visibility .18s step-end!important; }
    }
  </style>

</head>
<body>
  <div id="tcc-launch" aria-hidden="true">
    <div class="tcc-launch-stage tcc-launch-brand">
      <div class="tcc-launch-brand-inner">
        <img class="tcc-launch-logo" src="./app-icon.png" alt="">
        <div class="tcc-launch-brand-wordmark"><strong>TRAVEL</strong><span>COMMAND CENTRE</span></div>
      </div>
    </div>
    <div class="tcc-launch-stage tcc-launch-destination">
      <div class="tcc-launch-destination-inner">
        <div class="tcc-launch-flag"></div>
        <div class="tcc-launch-country"></div>
        <div class="tcc-launch-city"></div>
        <div class="tcc-launch-home-label">Opening Home</div>
      </div>
    </div>
  </div>
  <div id="app" class="app-shell"></div>
  <script>
    // Launch fail-safe: never let presentation chrome strand the user if a module
    // load is interrupted. This timer is presentation-only and does not perform
    // any network or service-worker work.
    globalThis.__TCC_LAUNCH_FAILSAFE__ = setTimeout(() => {
      const launch = document.querySelector('#tcc-launch');
      if (launch) launch.remove();
      document.documentElement.removeAttribute('data-tcc-launch-phase');
      document.documentElement.removeAttribute('data-tcc-launch-identity');
    }, 4800);
  </script>
  <script type="module">
    // Offline-first launch authority: import the complete installed shell immediately.
    // Service-worker update checks run only after the app is already open.
    await import('./src_main.js');

    /* R58: semantic colour is owned by the layered Home-derived CSS.
       Do not reintroduce post-render widget recolouring or a DOM MutationObserver
       as a second visual authority. */

  </script>
</body>
