  <style id="tcc-r71-critical-visual-guards">
    /* R71 critical unlayered guards only. The layered Home-derived stylesheet is
       the visual authority; do not recreate a second theme here. */

    /* Zero-horizontal-scroll hard stop for the target iPad shell. */
    :root {
      --tcc-safe-top:env(safe-area-inset-top,0px);
      --tcc-safe-right:env(safe-area-inset-right,0px);
      --tcc-safe-bottom:env(safe-area-inset-bottom,0px);
      --tcc-safe-left:env(safe-area-inset-left,0px);
    }
    html, body {
      overflow-x:hidden;
      /* Physical-iPad interaction authority: normal taps and double-taps must
         never zoom the app canvas. `manipulation` preserves deliberate pinch
         zoom while removing the browser's double-tap zoom gesture. */
      touch-action:manipulation;
    }
    #app, .app-shell {
      width:100%; max-width:100vw; min-width:0; overflow-x:hidden;
      touch-action:manipulation;
    }
    button, a, input, select, textarea, summary, [role="button"] { touch-action:manipulation; }
    /* iPad Safari can also smart-zoom a focused form control when its rendered
       text is below 16px. Keep every editable control at or above that floor. */
    input, select, textarea { font-size:max(16px,1em); }
    .tcc-modal {
      max-width:calc(100vw - 34px - var(--tcc-safe-left) - var(--tcc-safe-right));
      max-height:calc(100dvh - 34px - var(--tcc-safe-top) - var(--tcc-safe-bottom));
    }

    /* App Health visual authority moved to src_design_locked_contract.css in S27; S37 inherits the single authority. */

    /* Expanded views stay large enough to be useful on iPad, but their height is
       content-driven. Empty/read-only views must never be stretched into the
       photographed full-screen blank navy slabs. Scroll remains vertical only. */
    @media (orientation:landscape) and (min-width:900px) {
      .tcc-modal.tcc-expanded-modal {
        width:min(1040px,calc(100vw - var(--sidebar-w,224px) - 28px - var(--tcc-safe-left) - var(--tcc-safe-right)))!important;
        max-width:calc(100vw - var(--sidebar-w,224px) - 28px - var(--tcc-safe-left) - var(--tcc-safe-right))!important;
        height:fit-content!important;

        max-height:min(86dvh,820px)!important;
        margin:auto!important;
        overflow:hidden!important;
      }
      .tcc-modal.tcc-expanded-modal > form {
        height:auto!important;
        min-height:0;
        max-height:min(86dvh,820px);

    /* S20 launch sequence authority — native splash matched, offline, short and non-network-blocking.
       The complete Home screen is rendered underneath this overlay first. The
       launch layer then moves from the Travel Command icon to current-country
       identity and fades away; it never waits for a service worker or network. */
    #tcc-launch {
      position:fixed; inset:0; z-index:2147483000; display:grid; place-items:center;
      overflow:hidden; pointer-events:auto; opacity:1; visibility:visible;
      background:
        radial-gradient(circle at 50% 42%,rgba(38,126,176,.18),transparent 32%),
        radial-gradient(circle at 50% 100%,rgba(19,77,116,.13),transparent 44%),
        linear-gradient(155deg,#071423 0%,#04101d 58%,#020a12 100%);
      transition:opacity .42s cubic-bezier(.22,.72,.22,1),visibility .42s step-end;
      contain:layout paint style;
    }
    #tcc-launch::before {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(115deg,transparent 24%,rgba(123,214,245,.055) 49%,transparent 73%);
      transform:translateX(-42%); opacity:.7;
      animation:tccLaunchSheen 1.55s ease-out both;
    }
    .tcc-launch-stage {
      position:absolute; inset:0; display:grid; place-items:center; align-content:center;
      text-align:center; padding:calc(34px + var(--tcc-safe-top)) 36px calc(34px + var(--tcc-safe-bottom));
      transition:opacity .46s cubic-bezier(.22,.72,.22,1),transform .58s cubic-bezier(.22,.72,.22,1);
      will-change:opacity,transform; transform-origin:center center; transform:translateZ(0); -webkit-backface-visibility:hidden; backface-visibility:hidden;
    }
    .tcc-launch-brand { opacity:1; transform:scale(1); }
    .tcc-launch-brand-inner { display:grid; justify-items:center; gap:28px; }
    .tcc-launch-logo {
      width:240px; height:240px; border-radius:54px; object-fit:contain;
      image-rendering:auto; transform:translateZ(0);
      box-shadow:none;
    }
    .tcc-launch-brand-wordmark { display:grid; gap:2px; }
    .tcc-launch-brand-wordmark strong {
      color:#f3f8fb; font-family:Georgia,"Times New Roman",serif; font-size:50px;
      line-height:1; letter-spacing:.14em; font-weight:700;
    }
    .tcc-launch-brand-wordmark span {
      color:#82d7ef; font-size:18px; font-weight:900; letter-spacing:.31em;
      text-transform:uppercase;
    }
    .tcc-launch-destination { opacity:0; transform:translateY(10px) scale(.982); }
    .tcc-launch-destination-inner { display:grid; justify-items:center; gap:9px; min-width:min(720px,90vw); }
    .tcc-launch-flag,
    .tcc-launch-country,
    .tcc-launch-city,
    .tcc-launch-home-label {
      opacity:0; transform:translateY(6px);
      transition:opacity .34s cubic-bezier(.22,.72,.22,1),transform .42s cubic-bezier(.22,.72,.22,1);
    }
    .tcc-launch-flag {
      display:block; width:190px; height:136px; margin-bottom:24px;
      image-rendering:auto; transform:translateZ(0); filter:none;
    }
    .tcc-launch-country {
      color:#83ddf4; font-size:31px; line-height:1.15; font-weight:900;
      letter-spacing:.22em; text-transform:uppercase;
    }
    .tcc-launch-city {
      margin-top:4px; color:#f6f9fb; font-family:Georgia,"Times New Roman",serif;
      font-size:86px; line-height:1.02; font-weight:700; letter-spacing:-.02em;
      text-shadow:0 10px 30px rgba(0,0,0,.32);
    }
    .tcc-launch-home-label {
      margin-top:18px; color:#a9bac6; font-size:15px; line-height:1;
      font-weight:900; letter-spacing:.18em; text-transform:uppercase;
    }
    html[data-tcc-launch-phase="destination"] .tcc-launch-brand {
      opacity:0; transform:translateY(-8px) scale(.965);
    }
    html[data-tcc-launch-identity="ready"][data-tcc-launch-phase="destination"] .tcc-launch-destination {
      opacity:1; transform:translateY(0) scale(1);
    }
    html[data-tcc-launch-identity="ready"][data-tcc-launch-phase="destination"] .tcc-launch-flag {
      opacity:1; transform:none; transition-delay:.00s;
    }
    html[data-tcc-launch-identity="ready"][data-tcc-launch-phase="destination"] .tcc-launch-country {
      opacity:1; transform:none; transition-delay:.08s;
    }
    html[data-tcc-launch-identity="ready"][data-tcc-launch-phase="destination"] .tcc-launch-city {
      opacity:1; transform:none; transition-delay:.15s;
    }
    html[data-tcc-launch-identity="ready"][data-tcc-launch-phase="destination"] .tcc-launch-home-label {
      opacity:1; transform:none; transition-delay:.23s;
    }
    html[data-tcc-launch-phase="done"] #tcc-launch {
      opacity:0; visibility:hidden; pointer-events:none;
    }
    @keyframes tccLaunchSheen { 0%{transform:translateX(-46%);opacity:0} 28%{opacity:.66} 100%{transform:translateX(46%);opacity:0} }
    @media (max-width:1080px), (max-height:800px) {
      .tcc-launch-brand-inner { gap:24px; }
      .tcc-launch-logo { width:210px; height:210px; border-radius:48px; }
      .tcc-launch-brand-wordmark strong { font-size:44px; }
      .tcc-launch-brand-wordmark span { font-size:16px; }
      .tcc-launch-country { font-size:28px; }

    }
