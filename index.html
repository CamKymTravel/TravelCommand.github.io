<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Travel Command Centre">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./app-icon.png">
  <title>Travel Command Centre</title>
  <link rel="stylesheet" href="./src_design_app.css">

  <style id="tcc-r71-critical-visual-guards">
    /* R71 critical unlayered guards only. The layered Home-derived stylesheet is
       the visual authority; do not recreate a second theme here. */

    /* Zero-horizontal-scroll hard stop for the target iPad shell. */
    html, body { overflow-x:hidden; }
    .app-shell { width:100%; max-width:100vw; min-width:0; overflow-x:hidden; }

    /* App Health is the deliberate motion exception: dirty/unverified pulses as
       one restrained red heartbeat; successful verification is green and still. */
    @keyframes tccHealthHeartbeat {
      0%,100% { box-shadow:0 18px 40px rgba(0,0,0,.26),0 0 14px rgba(255,111,131,.07),inset 0 1px rgba(255,255,255,.035); }
      42% { box-shadow:0 18px 40px rgba(0,0,0,.26),0 0 21px rgba(255,111,131,.15),inset 0 0 0 1px rgba(255,111,131,.08); }
      56% { box-shadow:0 18px 40px rgba(0,0,0,.26),0 0 27px rgba(255,111,131,.20),inset 0 0 0 2px rgba(255,111,131,.11); }
      70% { box-shadow:0 18px 40px rgba(0,0,0,.26),0 0 19px rgba(255,111,131,.12),inset 0 0 0 1px rgba(255,111,131,.06); }
    }
    @keyframes tccHealthButtonHeartbeat {
      0%,100% { transform:scale(1); box-shadow:0 7px 18px rgba(111,23,44,.12); }
      52% { transform:scale(1.008); box-shadow:0 8px 22px rgba(255,111,131,.19); }
    }
    [data-screen="settings"] .settings-health-dirty,
    [data-screen="settings"] .settings-health-needs-attention {
      border-color:rgba(255,111,131,.46)!important;
      background:
        radial-gradient(circle at 86% 0%,rgba(255,111,131,.12),transparent 42%),
        linear-gradient(145deg,#2a202b,#101a2a 62%,#071321)!important;
      animation:tccHealthHeartbeat 1.55s ease-in-out infinite!important;
    }
    [data-screen="settings"] .settings-health-dirty .settings-health-run,
    [data-screen="settings"] .settings-health-needs-attention .settings-health-run {
      border-color:rgba(255,145,159,.66)!important;
      background:linear-gradient(180deg,#b83c54,#762136)!important;
      animation:tccHealthButtonHeartbeat 1.55s ease-in-out infinite!important;
      filter:none!important;
    }
    [data-screen="settings"] .settings-health-verified {
      border-color:rgba(87,214,155,.40)!important;
      background:
        radial-gradient(circle at 86% 0%,rgba(87,214,155,.10),transparent 43%),
        linear-gradient(145deg,#172d2b,#0b2026 60%,#071321)!important;
      animation:none!important;
    }
    [data-screen="settings"] .settings-health-verified .settings-health-run {
      border-color:rgba(126,237,184,.56)!important;
      background:linear-gradient(180deg,#278f67,#176147)!important;
      animation:none!important;
      filter:none!important;
    }

    /* Strong operational status copy remains readable. */
    [data-screen="settings"] .settings-health-card-copy > strong { font-size:15px!important; }
    [data-screen="settings"] .settings-health-card-copy > p { font-size:12px!important; line-height:1.38!important; }
    [data-screen="settings"] .settings-health-card-status small { font-size:11px!important; }

    /* Expanded means genuinely large, and scroll is vertical only. */
    @media (orientation:landscape) and (min-width:900px) {
      .tcc-modal.tcc-expanded-modal {
        width:calc(100vw - 22px)!important;
        max-width:none!important;
        height:calc(100dvh - 22px)!important;
        max-height:none!important;
        margin:auto!important;
        overflow:hidden!important;
      }
      .tcc-modal.tcc-expanded-modal > form {
        height:100%;
        min-height:0;
        grid-template-rows:auto minmax(0,1fr) auto;
      }
      .tcc-modal.tcc-expanded-modal .modal-body,
      .tcc-modal.tcc-expanded-modal .tcc-expanded-card-body {
        min-height:0;
        overflow-y:auto;
        overflow-x:hidden;
      }
      .tcc-modal.tcc-expanded-modal .tcc-expanded-card-snapshot { min-height:calc(100% - 4px); }
      .tcc-modal.tcc-expanded-modal .offline-map svg { max-height:none!important; height:min(64dvh,620px)!important; }
    }

    /* Information-bearing dashboard labels never fall back to micro-text. */
    [data-screen="itinerary"] .itinerary-stat-copy span,
    [data-screen="itinerary"] .itinerary-map-metric span,
    [data-screen="journey-history"] .journey-milestone small,
    [data-screen="journey-history"] .journey-milestone span,
    [data-screen="reservations"] .reservation-tab-support small,
    [data-screen="budget"] .budget-muted,
    [data-screen="checklist"] .checklist-note,
    [data-screen="vault"] .vault-empty { font-size:12px!important; }

    /* App Health remains the deliberate motion exception even when iPad Reduce
       Motion is enabled, but the accessible variant removes button scaling and
       slows the panel to a very small luminance/edge heartbeat. */
    @keyframes tccHealthReducedHeartbeat {
      0%,100% { box-shadow:0 18px 40px rgba(0,0,0,.26),0 0 12px rgba(255,111,131,.065),inset 0 1px rgba(255,255,255,.035); }
      50% { box-shadow:0 18px 40px rgba(0,0,0,.26),0 0 18px rgba(255,111,131,.115),inset 0 0 0 1px rgba(255,111,131,.065); }
    }
    @media (prefers-reduced-motion:reduce) {
      [data-screen="settings"] .settings-health-dirty,
      [data-screen="settings"] .settings-health-needs-attention {
        animation:tccHealthReducedHeartbeat 2.6s ease-in-out infinite!important;
      }
      [data-screen="settings"] .settings-health-dirty .settings-health-run,
      [data-screen="settings"] .settings-health-needs-attention .settings-health-run { animation:none!important; transform:none!important; }
    }
  </style>

</head>
<body>
  <div id="app" class="app-shell"></div>
  <script type="module">
    const params = new URLSearchParams(globalThis.location?.search || '');
    // This downloadable Athens package is a simulation-only derivative.
    // Force simulation even when an older iPad Home Screen shortcut opens
    // plain index.html and drops the manifest's ?simulation=1 query string.
    const forceAthensSimulation = true;
    if (forceAthensSimulation || params.get('simulation') === '1') {
      const { installSimulationRuntime } = await import('./simulation-clock.js');
      installSimulationRuntime({ serviceWorkerUrl:'./sw.js?v=55-screenshot-audit-r72-2026-09-05' });
      document.title = 'Travel Command Centre — Simulation';
      document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute('content','TCC Simulation');
    }

    // Build-consistency barrier. A newly fetched index can otherwise execute
    // beneath the previous service worker for its first load, producing a
    // dangerous hybrid such as a new build title with old cached screen
    // modules/icons. Before importing the app, answer the worker's safe-refresh
    // probe and give the current build worker a chance to activate/claim.
    const bootWorkerUrl = globalThis.__TCC_RUNTIME_CONFIG__?.serviceWorkerUrl || './sw.js?v=55-screenshot-audit-r72-2026-09-05';
    if ('serviceWorker' in navigator && bootWorkerUrl) {
      const safeBootResponder = event => {
        if (event?.data?.type !== 'TCC_SW_UPDATE_QUERY') return;
        try { event.ports?.[0]?.postMessage({ type:'TCC_SW_UPDATE_READY', ready:true }); } catch {}
      };
      navigator.serviceWorker.addEventListener('message', safeBootResponder);
      try {
        const expectedWorker = new URL(bootWorkerUrl, globalThis.location.href).href;
        const registration = await navigator.serviceWorker.register(bootWorkerUrl, { updateViaCache:'none' });
        await registration.update();

        const waitForExpectedActivation = async () => {
          const findExpected = () => [registration.installing, registration.waiting, registration.active]
            .find(worker => worker?.scriptURL === expectedWorker) || null;
          let worker = findExpected();
          if (!worker || worker.state === 'activated') return worker;
          await Promise.race([
            new Promise(resolve => {
              const onState = () => { if (worker.state === 'activated' || worker.state === 'redundant') { worker.removeEventListener('statechange', onState); resolve(); } };
              worker.addEventListener('statechange', onState);
              onState();
            }),
            new Promise(resolve => setTimeout(resolve, 8000))
          ]);
          worker = findExpected();
          return worker;
        };

        const controller = navigator.serviceWorker.controller;
        if (controller && controller.scriptURL !== expectedWorker) {
          // We are a newly fetched document still running under the predecessor
          // worker. Never import unversioned app modules in this state: the old
          // worker could answer them from its previous cache and create a
          // visually mixed build. This document has not started the app yet, so
          // a controlled reload is safe and cannot discard an editor/picker.
          const expected = await waitForExpectedActivation();
          if (expected?.state === 'activated' || registration.active?.scriptURL === expectedWorker) {
            globalThis.location.reload();
            await new Promise(() => {});
          }
          throw new Error('Travel Command Centre update could not activate the expected offline shell. Reload before using the app.');
        }

        if (!controller) {
          // First install: allow the new worker to claim this pristine boot page
          // before app modules start where possible. If control is not acquired
          // quickly, direct network module loading is still internally
          // consistent because no predecessor worker is serving stale assets.
          await Promise.race([
            new Promise(resolve => navigator.serviceWorker.addEventListener('controllerchange', resolve, { once:true })),
            new Promise(resolve => setTimeout(resolve, 2200))
          ]);
        }
      } catch (error) {
        navigator.serviceWorker.removeEventListener('message', safeBootResponder);
        const controller = navigator.serviceWorker.controller;
        const expectedWorker = new URL(bootWorkerUrl, globalThis.location.href).href;
        if (controller && controller.scriptURL !== expectedWorker) {
          const app = document.getElementById('app');
          if (app) app.innerHTML = '<main class="screen-root"><section class="foundation-marker"><p class="eyebrow">OFFLINE UPDATE</p><h1>Finishing app update</h1><p>The previous offline shell is still controlling this page. Reload Travel Command Centre before making changes so old and new screen files cannot be mixed.</p><button id="tcc-boot-reload" class="button" type="button">Reload App</button></section></main>';
          document.getElementById('tcc-boot-reload')?.addEventListener('click', () => globalThis.location.reload());
          throw error;
        }
        console.error(error);
      } finally {
        navigator.serviceWorker.removeEventListener('message', safeBootResponder);
      }
    }

    await import('./src_main.js');

    /* R58: semantic colour is owned by the layered Home-derived CSS.
       Do not reintroduce post-render widget recolouring or a DOM MutationObserver
       as a second visual authority. */

  </script>
</body>
</html>
